# 巡检点配置：坐标位于 map 坐标系，与 generate_maps.py 布局对齐（避开货架/设备占据区）。
# yaw 单位为弧度。机器人按楼层顺序逐点导航，一层完成后切换到下一层。
# task 字段供视觉巡检节点使用：gauge=仪表盘, indicator=指示灯, extinguisher=灭火器区。
patrol_points:
