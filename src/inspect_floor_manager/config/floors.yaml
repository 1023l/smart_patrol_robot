# 楼层配置：五层工业厂房采用分层独立子地图架构。
# 每层对应一张独立栅格地图（map 为地图 yaml 文件名，位于 maps_dir 目录下）；
# elevator 为该层电梯厅南侧出入口位姿（map 坐标系，yaw 单位为弧度），
# 与 generate_maps.py 中北侧电梯厅（9~11m, 17~19m）对齐。
# 切层后在此发布 /initialpose，触发 AMCL 重定位；yaw=-1.57 朝南进入本层。
floors:
  1:
    map: "floor1.yaml"
    elevator:
      x: 10.0
      y: 16.5
      yaw: -1.57
  2:
    map: "floor2.yaml"
    elevator:
      x: 10.0
      y: 16.5
      yaw: -1.57
  3:
    map: "floor3.yaml"
    elevator:
      x: 10.0
      y: 16.5
      yaw: -1.57
  4:
    map: "floor4.yaml"
    elevator:
      x: 10.0
      y: 16.5
      yaw: -1.57
  5:
    map: "floor5.yaml"
