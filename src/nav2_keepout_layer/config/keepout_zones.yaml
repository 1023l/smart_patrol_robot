# KeepOutZone 禁区配置（与 nav2_params.yaml / generate_maps.py 对齐）
# 场景：玻璃墙体激光穿透 → 栅格空洞 → 用多边形禁区人工补齐虚拟障碍
# 电梯厅在北侧中部（9~11m, 17~19m）；东侧玻璃在 x≈18.0~18.6
keepout_layer:
  enabled: true
  topic_name: keepout_zones
  high_cost_value: 252          # 非致命禁区的代价值（接近内切膨胀，规划器强回避）

  # 静态禁区：id → {lethal, points 展平顶点数组}
  # 顶点顺序不限（射线法对凸/凹多边形均正确），坐标为 map 系（米）
  zones:
    glass_wall_east:            # 东侧玻璃墙，激光穿透补齐
      lethal: true
      points: [18.0, 2.0,  18.0, 14.0,  18.6, 14.0,  18.6, 2.0]
    glass_wall_west:
      lethal: true
      points: [1.4, 2.0,  1.4, 14.0,  2.0, 14.0,  2.0, 2.0]
    elevator_shaft:             # 北侧电梯井，禁止穿行（厅口南侧可通行）
      lethal: true
      points: [9.0, 17.5,  9.0, 19.0,  11.0, 19.0,  11.0, 17.5]
    charging_area:              # 充电区：非致命高代价，可通行但默认回避
      lethal: false
      points: [3.0, 1.0,  3.0, 2.5,  5.0, 2.5,  5.0, 1.0]

# 动态增删（运行期话题，与静态共用效果）：
#   ros2 topic pub /keepout_zones inspect_interfaces/msg/KeepoutZone \
#     "{zone_id: temp_zone, action: 0, lethal: true,
#       polygon: [{x: 3.0, y: 3.0}, {x: 3.0, y: 4.0}, {x: 4.0, y: 4.0}, {x: 4.0, y: 3.0}]}"
#   ros2 topic pub /keepout_zones inspect_interfaces/msg/KeepoutZone \
#     "{zone_id: temp_zone, action: 1}"
