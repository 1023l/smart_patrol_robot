# KeepOutZone 禁区示例配置（并入 nav2_params.yaml 的代价地图层段使用）
# 场景：玻璃墙体激光穿透 → 栅格空洞 → 用多边形禁区人工补齐虚拟障碍
keepout_layer:
  enabled: true
  topic_name: keepout_zones
  high_cost_value: 252          # 非致命禁区的代价值（接近内切膨胀，规划器强回避）

  # 静态禁区：id → {lethal, points 展平顶点数组}
  # 顶点顺序不限（射线法对凸/凹多边形均正确），坐标为 map 系（米）
  zones:
    glass_wall_1:               # 一层东侧玻璃墙，激光穿透补齐
      lethal: true
      points: [5.0, 2.0,  5.0, 8.0,  5.4, 8.0,  5.4, 2.0]
    elevator_shaft:             # 电梯井开口，禁止穿行
      lethal: true
      points: [1.0, 1.0,  1.0, 2.0,  2.0, 2.0,  2.0, 1.0]
    charging_area:               # 充电区：非致命高代价，可通行但默认回避
      lethal: false
      points: [10.0, 10.0,  10.0, 12.0,  12.0, 12.0,  12.0, 10.0]

# 动态增删（运行期话题，与静态共用效果）：
#   ros2 topic pub /keepout_zones inspect_interfaces/msg/KeepoutZone \
#     "{zone_id: temp_zone, action: 0, lethal: true,
#       polygon: [{x: 3.0, y: 3.0}, {x: 3.0, y: 4.0}, {x: 4.0, y: 4.0}, {x: 4.0, y: 3.0}]}"
#   ros2 topic pub /keepout_zones inspect_interfaces/msg/KeepoutZone \
#     "{zone_id: temp_zone, action: 1}"
